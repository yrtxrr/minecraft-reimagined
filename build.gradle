plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0-alpha'
group = 'dev.reimagined'
base { archivesName = 'reimagined' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.264'
    runs {
        client {
            client()
            if (project.hasProperty('faunaAcceptance')) systemProperty 'reimagined.faunaAcceptance', 'true'
            if (project.hasProperty('fishingAcceptance')) systemProperty 'reimagined.fishingAcceptance', 'true'
            if (project.hasProperty('quickPlayWorld')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.property('quickPlayWorld')
            }
        }
        // Optional local multiplayer smoke-test client; separate options/saves and dev identity.
        alphaPeer {
            client()
            gameDirectory = file('run-alpha-peer')
            programArgument '--username'
            programArgument 'AlphaObserver'
            programArgument '--quickPlayMultiplayer'
            programArgument project.findProperty('alphaPeerAddress') ?: '127.0.0.1:25578'
            jvmArgument '-Xmx1536M'
            jvmArgument '-XX:ActiveProcessorCount=2'
        }
        server { server(); programArgument '--nogui' }
        mechanicalProfile {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-mechanical-profile')
            systemProperty 'reimagined.mechanicalProfile', 'true'
            systemProperty 'reimagined.mechanicalRestartProbe', project.findProperty('profileRestart') ?: 'false'
            systemProperty 'reimagined.profileRevision', project.findProperty('profileRevision') ?: 'working-tree'
            systemProperty 'reimagined.profileLabel', project.findProperty('profileLabel') ?: 'candidate'
            systemProperty 'reimagined.profileWarmupTicks', project.findProperty('profileWarmupTicks') ?: '200'
            jvmArgument '-Xmx2G'
            jvmArgument '-XX:ActiveProcessorCount=4'
        }
        spellAccessProfile {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-spell-access-profile')
            systemProperty 'reimagined.spellAccessProfile', 'true'
            systemProperty 'reimagined.profileRevision', project.findProperty('profileRevision') ?: 'working-tree'
            jvmArgument '-Xmx2G'
            jvmArgument '-XX:ActiveProcessorCount=4'
        }
        magicProfile {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-magic-profile')
            systemProperty 'reimagined.magicProfile', 'true'
            systemProperty 'reimagined.profileRevision', project.findProperty('profileRevision') ?: 'working-tree'
            jvmArgument '-Xmx2G'
            jvmArgument '-XX:ActiveProcessorCount=4'
        }
        cookingProfile {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-cooking-profile')
            systemProperty 'reimagined.cookingProfile', 'true'
            systemProperty 'reimagined.profileRevision', project.findProperty('profileRevision') ?: 'working-tree'
            jvmArgument '-Xmx2G'
            jvmArgument '-XX:ActiveProcessorCount=4'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'reimagined'
        }
    }
    runs.configureEach {
        // Gradle's systemProp settings do not automatically reach Minecraft child JVMs.
        // Forward only non-credential routing/trust settings, preserving TLS validation.
        ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort',
         'javax.net.ssl.trustStore'].each { key ->
            def value = System.getProperty(key)
            if (value != null) systemProperty key, value
        }
    }
    mods { reimagined { sourceSet sourceSets.main } }
}
// Explicit development opt-in; default builds/servers do not resolve or require JEI.
// Supply a verified published four-part version after official Maven access is allowed.
def withJei = providers.gradleProperty('withJei').map { it.isEmpty() || it.toBoolean() }.getOrElse(false)
if (withJei) {
    def jeiVersion = providers.gradleProperty('jeiVersion').orNull
    if (jeiVersion == null || !(jeiVersion ==~ /19\.\d+\.\d+\.\d+/))
        throw new GradleException('Use -PwithJei -PjeiVersion=<published 19.x.y.build for Minecraft 1.21.1 NeoForge>. No version is guessed.')
    repositories {
        maven {
            url = uri('https://maven.blamejared.com')
            content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
        }
    }
    dependencies { runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jeiVersion}" }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Test fixtures run from development outputs and are never shipped in the player JAR.
tasks.named('jar') {
    exclude 'dev/reimagined/gametest/**'
    exclude 'dev/reimagined/engineering/profile/**'
    exclude 'dev/reimagined/cooking/profile/**'
    exclude 'data/reimagined/structure/empty.nbt'
}
