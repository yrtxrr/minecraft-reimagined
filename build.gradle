plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0-alpha'
group = 'dev.reimagined'
base { archivesName = 'reimagined' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.264'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'reimagined'
        }
    }
    runs.configureEach {
        // Gradle's systemProp settings do not automatically reach Minecraft child JVMs.
        // Forward only non-credential routing/trust settings, preserving TLS validation.
        ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort',
         'javax.net.ssl.trustStore'].each { key ->
            def value = System.getProperty(key)
            if (value != null) systemProperty key, value
        }
    }
    mods { reimagined { sourceSet sourceSets.main } }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Test fixtures run from development outputs and are never shipped in the player JAR.
tasks.named('jar') {
    exclude 'dev/reimagined/gametest/**'
    exclude 'data/reimagined/structure/empty.nbt'
}
