name: Windows first-run kit
on:
  push:
    tags: ['windows-trial-*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build
      - run: python3 -m unittest discover -s scripts/modpack -p 'test_*.py'
      - run: python3 scripts/test-modpack.py
      - run: python3 scripts/validate-resources.py
      - run: python3 scripts/validate-quests.py
      - run: python3 scripts/modpack/package-installer.py
      - name: Record archive checksum
        working-directory: build/modpack
        run: sha256sum Reimagined-Windows-Setup.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Reimagined-Windows-Setup
          if-no-files-found: error
          path: |
            build/modpack/Reimagined-Windows-Setup.zip
            build/modpack/SHA256SUMS.txt
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Reimagined-Windows-Setup
          path: release-files
      - name: Publish immutable first-run prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag --prerelease
          --title "$RELEASE_TAG — Windows first-run kit"
          --notes-file modpack/WINDOWS_RELEASE_NOTES.md
          release-files/Reimagined-Windows-Setup.zip
          release-files/SHA256SUMS.txt
